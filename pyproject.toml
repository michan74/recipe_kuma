[project]
name = "recipe-kuma"
version = "0.1.0"
description = "YouTubeショート動画を解析してレシピメモにまとめるツール"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "yt-dlp>=2024.0",
    "faster-whisper>=1.0",
    "google-genai>=0.3",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
